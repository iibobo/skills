<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>
:root{color-scheme:light;--ink:#292735;--muted:#696575;--line:#d9d5e5;--accent:#6949a3;--surface:#f6f5fa}*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;min-height:0}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);color:var(--ink);font:15px Arial,"PingFang SC","Microsoft YaHei",sans-serif}header{flex-shrink:0;padding:12px 24px;background:white;border-bottom:1px solid var(--line)}h1{font-size:21px;line-height:1.3;margin:0 0 4px;font-weight:650}header p{font-size:12px;line-height:1.5;margin:0;color:var(--muted)}a{color:var(--accent)}main{flex:1;min-height:0;width:100%;max-width:2000px;margin:auto;display:flex;flex-direction:column;padding:8px 24px 12px;overflow-anchor:none}button{font:inherit;color:inherit;background:white;border:1px solid var(--line);border-radius:5px;padding:5px 8px;cursor:pointer}button:hover{border-color:var(--accent);background:#f2eef9}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:wait}button[aria-selected=true]{color:white;background:var(--accent);border-color:var(--accent)}
.diagram-navigation{touch-action:auto;user-select:none;display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:0;margin-bottom:8px}#tabs{display:flex;flex:1;min-width:0;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}#tabs.is-dragging,#tabs.is-dragging button{cursor:grabbing}#tabs::-webkit-scrollbar{display:none}#tabs button{flex:0 0 auto;white-space:nowrap;font-size:12px;line-height:1.3}.nav-arrow{display:flex;align-items:center;justify-content:center;flex:0 0 26px;width:26px;height:26px;padding:4px;color:var(--accent)}.nav-arrow svg{width:16px;height:16px}.nav-arrow path{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:white}.toolbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:4px 14px;border-bottom:1px solid var(--line);min-height:34px}.row-content{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:1;min-width:0;flex-wrap:wrap}h2{font-size:14px;line-height:1.4;margin:0}.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.controls button{font-size:12px;line-height:1.3;padding:4px 8px}output{font-size:12px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}.row-toggle{margin-left:auto;flex:0 0 26px;width:26px;height:26px;padding:2px;border-color:transparent;color:var(--muted)}.row-summary{font-size:12px;color:var(--muted)}.viewport{position:relative;flex:1;min-height:0;overflow:auto;padding:24px;background:white;overscroll-behavior:contain}.canvas{margin:auto}
.viewport[data-pannable] .canvas{cursor:grab}
.viewport.is-panning,.viewport.is-panning .canvas{cursor:grabbing;user-select:none}
.canvas>svg{display:block;max-width:none!important;height:100%;width:100%}#status{color:var(--muted);padding:22px;text-align:center;line-height:1.8}
.viewport:fullscreen,.viewport.is-fullscreen{width:100vw;height:100dvh;min-height:0;max-height:none;border:0;border-radius:0;background:white;padding-top:80px}.viewport.is-fullscreen{position:fixed;inset:0;z-index:1000}.fullscreen-zoom{display:none;position:fixed;right:20px;bottom:20px;z-index:1100;max-width:calc(100vw - 24px);align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:4px;padding:6px;background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 3px 16px #29273520}.fullscreen-zoom button{height:28px;padding:5px 8px;font-size:12px;line-height:1.3;white-space:nowrap}.viewport:fullscreen .fullscreen-zoom,.viewport.is-fullscreen .fullscreen-zoom{display:flex}.viewport:fullscreen .diagram-navigation,.viewport.is-fullscreen .diagram-navigation{position:fixed;top:16px;left:20px;right:20px;z-index:1100;padding:6px;gap:5px;margin:0;border:1px solid var(--line);border-radius:8px;background:white;box-shadow:0 3px 16px #29273520}
@media(max-width:640px){header{padding:10px 16px}h1{font-size:19px}main{padding:6px 10px 8px}.toolbar{padding:4px 10px}.viewport{padding:12px}.fullscreen-zoom{right:12px;bottom:12px}.viewport:fullscreen .diagram-navigation,.viewport.is-fullscreen .diagram-navigation{top:12px;left:12px;right:12px}}

/* The dropdown floats over the canvas so opening it keeps the current zoom. */
header{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.header-copy{flex:1;min-width:0}
.diagram-legend{position:relative;flex:0 0 206px;max-width:100%;margin-left:auto;font-size:12px;color:var(--muted)}
.diagram-legend summary{display:flex;align-items:center;justify-content:space-between;gap:20px;min-width:148px;min-height:28px;padding:4px 9px;list-style:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.diagram-legend summary::-webkit-details-marker{display:none}
.diagram-legend summary:hover{border-color:var(--accent)}
.diagram-legend summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.diagram-legend summary::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.diagram-legend[open] summary::after{transform:rotate(225deg)}
.legend-items{position:absolute;top:calc(100% + 5px);right:0;width:min(24rem,calc(100vw - 32px));max-height:min(24rem,60dvh);overflow:auto;overscroll-behavior:contain;margin:0;padding:6px 10px;list-style:none;background:white;border:1px solid var(--line);border-radius:7px;box-shadow:0 5px 16px #29273520}
.legend-items li{display:flex;align-items:center;gap:8px;padding:5px 0;line-height:1.4}
.legend-items li+li{border-top:1px solid var(--surface)}
.legend-items strong{color:var(--ink);font-weight:650}
.legend-key{display:grid;place-items:center;flex:0 0 64px;color:var(--ink);font-size:11px;white-space:nowrap}
.legend-key svg{width:38px;height:22px}
.legend-key .node-shape{fill:#e7f2ff;stroke:#6b8bb7}
.legend-key .signal{fill:none;stroke:#53657e;stroke-width:1.4;stroke-linejoin:round}
.legend-key .arrowhead{fill:#53657e}
.legend-key .decision{fill:#fff4cc;stroke:#ae9342}
.legend-key .success{fill:#dcfce7;stroke:#42815a}
.legend-key .failure{fill:#fee2e2;stroke:#b86a6a}
@media(max-width:640px){header{flex-wrap:wrap;gap:6px}.header-copy{flex-basis:100%}}
</style></head><body>
<header><div class="header-copy"><h1>@@TITLE@@</h1><p><a href="@@SOURCE@@">阅读 Markdown 源文件</a> · 拖动画布 · Shift + 滚轮缩放</p></div>
<details class="diagram-legend" id="diagram-legend">
<summary>流程图图例</summary>
<ul class="legend-items">
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><rect class="node-shape" x="2" y="4" width="34" height="14" rx="7"/></svg></span><span><strong>开始与结束</strong>　标出流程入口或最终结果。</span></li>
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><rect class="node-shape" x="2" y="4" width="34" height="14"/></svg></span><span><strong>处理步骤</strong>　执行一个操作。</span></li>
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><path class="decision" d="M19 2 36 11 19 20 2 11Z"/></svg></span><span><strong>条件判断</strong>　按箭头旁的条件选择出口。</span></li>
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><path class="node-shape" d="M9 4H36L29 18H2Z"/></svg></span><span><strong>输入与输出</strong>　平行四边形表示进入或离开流程的数据。</span></li>
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><rect class="node-shape" x="2" y="4" width="34" height="14"/><path class="signal" d="M7 4V18M31 4V18"/></svg></span><span><strong>子流程</strong>　两侧内竖线表示这里调用或展开一段独立流程。</span></li>
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><path class="node-shape" d="M7 6C7 1 31 1 31 6V16C31 21 7 21 7 16Z M7 6C7 11 31 11 31 6"/></svg></span><span><strong>持久化存储</strong>　表示数据库或其他持久化存储。</span></li>
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><path class="signal" d="M2 11H32"/><path class="arrowhead" d="M29 7 36 11 29 15Z"/></svg></span><span><strong>流程方向</strong>　沿箭头读下一步，指回前序节点表示重复。</span></li>
  <li><span class="legend-key" aria-hidden="true"><svg viewBox="0 0 38 22" focusable="false"><rect class="success" x="1" y="6" width="16" height="10" rx="5"/><rect class="failure" x="21" y="6" width="16" height="10" rx="5"/></svg></span><span><strong>结果颜色</strong>　绿色表示正常完成，红色表示失败或拒绝。</span></li>
</ul>
</details>
</header><main>
<div class="diagram-navigation" id="diagram-navigation" aria-label="流程图导航"><button type="button" class="nav-arrow" id="previous-diagram" aria-label="上一张流程图"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8 10 13"/></svg></button><nav id="tabs" role="tablist" aria-label="选择流程图"></nav><button type="button" class="nav-arrow" id="next-diagram" aria-label="下一张流程图"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 11 8 6 13"/></svg></button></div>
<section class="panel" id="diagram-panel" role="tabpanel" aria-labelledby="tab-0"><div class="toolbar"><div class="row-content" id="toolbar-content"><h2 id="title"></h2><div class="controls" aria-label="图形工具"><button id="zoom-out" aria-label="缩小" disabled>−</button><output id="scale">—</output><button id="zoom-in" aria-label="放大" disabled>＋</button><button id="fit" disabled>适应画布</button><button id="actual" disabled>100%</button><button id="fullscreen" data-display-cycle disabled>浏览器全屏</button><button id="export" disabled>导出 SVG</button></div></div><span class="row-summary" id="toolbar-summary" hidden>图形工具栏</span><button class="row-toggle" id="toolbar-toggle" aria-label="收起图形工具栏" aria-expanded="true" aria-controls="toolbar-content">⌃</button></div>
<div class="viewport" id="viewport" tabindex="0" aria-label="流程图画布" aria-description="放大后可拖动或滚动查看，按住 Shift 滚动鼠标滚轮可缩放"><p id="status" role="status" aria-live="polite">正在加载 Mermaid.js…</p><div class="canvas" id="canvas"></div><div class="fullscreen-zoom" role="group" aria-label="全屏缩放控制"><button data-zoom-target="zoom-out" aria-label="缩小全屏流程图" disabled>−</button><output id="fullscreen-scale">—</output><button data-zoom-target="zoom-in" aria-label="放大全屏流程图" disabled>＋</button><button data-zoom-target="fit" disabled>适应画布</button><button data-display-cycle disabled>屏幕全屏</button></div></div></section></main>
<script src="@@ASSETS@@/diagram-navigation.js"></script>
<script src="@@ASSETS@@/flowchart-edges.js"></script>
<script id="diagram-data" type="application/json">@@DIAGRAMS@@</script>
<script id="source-map" type="application/json">@@SOURCE_MAP@@</script>
<script src="@@ASSETS@@/mermaid-12.3.0.min.js"></script>
<script>
'use strict';

const legend = document.getElementById('diagram-legend');
document.addEventListener('click', event => {
  if (legend.open && !legend.contains(event.target)) legend.open = false;
});
legend.addEventListener('keydown', event => {
  if (event.key === 'Escape' && legend.open) {
    event.preventDefault();
    legend.open = false;
    legend.querySelector('summary').focus();
  }
});


const diagrams = JSON.parse(document.getElementById('diagram-data').textContent);
const sourceMap = JSON.parse(document.getElementById('source-map').textContent);
const tabs = document.getElementById('tabs');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const status = document.getElementById('status');
const title = document.getElementById('title');
const panel = document.getElementById('diagram-panel');
const controls = document.querySelectorAll('.controls button, .fullscreen-zoom button');
const fullscreenZoom = document.querySelector('.fullscreen-zoom');
const fullscreenButton = document.getElementById('fullscreen');
const displayButtons = document.querySelectorAll('[data-display-cycle]');
const navigation = document.getElementById('diagram-navigation');
const navigationHome = document.createComment('流程图导航原始位置');
navigation.before(navigationHome);

const renderCache = new Map();
let selected = 0;
let revision = 0;
let zoom = 1;
let naturalWidth = 0;
let naturalHeight = 0;
let fitMode = true;
let pan = null;

function setZoom(value) {
  zoom = Math.max(.1, Math.min(3, value));
  canvas.style.width = naturalWidth * zoom + 'px';
  canvas.style.height = naturalHeight * zoom + 'px';
  updatePanAvailability();
  const label = Math.round(zoom * 100) + '%';
  document.getElementById('scale').textContent = label;
  document.getElementById('fullscreen-scale').textContent = label;
}

function fit() {
  fitMode = true;
  if (!naturalWidth || !naturalHeight) return;
  const style = getComputedStyle(viewport);
  const width = viewport.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const bottom = getComputedStyle(fullscreenZoom).display === 'none'
    ? viewport.getBoundingClientRect().bottom
    : fullscreenZoom.getBoundingClientRect().top - 12;
  const height = Math.min(viewport.clientHeight, bottom - viewport.getBoundingClientRect().top)
    - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  setZoom(Math.min(1, width / naturalWidth, height / naturalHeight));
  viewport.scrollTo(0, 0);
}

function revealTab(index, animate = true) {
  const area = tabs.getBoundingClientRect();
  const item = tabs.children[index].getBoundingClientRect();
  const left = item.left < area.left ? item.left - area.left : Math.max(0, item.right - area.right);
  if (left) {
    tabs.scrollBy({
      left,
      behavior: animate && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto',
    });
  }
}

async function select(index) {
  const token = ++revision;
  selected = index;
  title.textContent = diagrams[index].title;
  panel.setAttribute('aria-labelledby', 'tab-' + index);
  Array.from(tabs.children).forEach((button, i) => {
    button.setAttribute('aria-selected', String(i === index));
    button.tabIndex = i === index ? 0 : -1;
  });
  requestAnimationFrame(() => revealTab(selected));

  endPan();
  viewport.removeAttribute('data-pannable');
  controls.forEach(button => { button.disabled = true; });
  canvas.replaceChildren();
  canvas.style.width = '';
  canvas.style.height = '';
  naturalWidth = 0;
  naturalHeight = 0;
  status.hidden = false;
  status.textContent = '正在绘制流程图…';

  try {
    if (!renderCache.has(index)) {
      const result = await mermaid.render('flowchart-' + token, diagrams[index].source);
      renderCache.set(index, result.svg);
    }
    if (token !== revision) return;
    canvas.innerHTML = renderCache.get(index);
    const svg = canvas.querySelector('svg');
    for (const node of svg.querySelectorAll('g.node')) {
      const nodeId = node.id.match(/-flowchart-(.+)-\d+$/)?.[1];
      const symbol = (index + 1) + ':' + nodeId;
      if (nodeId && Object.hasOwn(sourceMap, symbol)) node.dataset.sourceSymbol = symbol;
    }
    const direction = diagrams[index].source.match(/^\s*(?:flowchart|graph)\s+(\w+)/)[1];
    straightenFlowchartEdges(svg, direction, diagrams[index].source);
    const { width, height } = svg.viewBox.baseVal;
    if (!width || !height) throw new Error('图表尺寸无效');
    naturalWidth = width;
    naturalHeight = height;
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', diagrams[index].title);
    status.hidden = true;
    if (fitMode) fit();
    else setZoom(zoom);
    viewport.scrollTo(0, 0);
    controls.forEach(button => { button.disabled = false; });
  } catch (error) {
    if (token !== revision) return;
    canvas.replaceChildren();
    status.textContent = '流程图渲染失败：' + error.message;
  }
}

function adjacentIndex(direction) {
  return (selected + direction + diagrams.length) % diagrams.length;
}

diagrams.forEach((diagram, index) => {
  const button = document.createElement('button');
  button.id = 'tab-' + index;
  button.type = 'button';
  button.setAttribute('role', 'tab');
  button.setAttribute('aria-controls', panel.id);
  button.textContent = diagram.title;
  button.title = diagram.title;
  button.addEventListener('click', () => select(index));
  button.addEventListener('keydown', event => {
    let next;
    switch (event.key) {
      case 'ArrowLeft': next = adjacentIndex(-1); break;
      case 'ArrowRight': next = adjacentIndex(1); break;
      case 'Home': next = 0; break;
      case 'End': next = diagrams.length - 1; break;
      default: return;
    }
    event.preventDefault();
    tabs.children[next].focus({ preventScroll: true });
    select(next);
  });
  tabs.append(button);
});

installDiagramNavigation(navigation);
new ResizeObserver(() => revealTab(selected, false)).observe(tabs);
navigation.setAttribute('aria-description', '左右滑动浏览标签，点击标签选择流程图');
document.getElementById('previous-diagram').onclick = () => select(adjacentIndex(-1));
document.getElementById('next-diagram').onclick = () => select(adjacentIndex(1));
document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey
      || tabs.contains(event.target)
      || event.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    select(adjacentIndex(event.key === 'ArrowLeft' ? -1 : 1));
  }
});

function manualZoom(value) {
  fitMode = false;
  setZoom(value);
}

document.getElementById('zoom-in').onclick = () => manualZoom(zoom * 1.2);
document.getElementById('zoom-out').onclick = () => manualZoom(zoom / 1.2);
document.getElementById('actual').onclick = () => manualZoom(1);
document.getElementById('fit').onclick = fit;
document.querySelectorAll('[data-zoom-target]').forEach(button => {
  button.onclick = () => document.getElementById(button.dataset.zoomTarget).click();
});
new ResizeObserver(() => {
  if (fitMode) fit();
  else updatePanAvailability();
}).observe(viewport);

function updatePanAvailability() {
  const overflow = viewport.scrollWidth > viewport.clientWidth || viewport.scrollHeight > viewport.clientHeight;
  viewport.toggleAttribute('data-pannable', overflow && naturalWidth > 0);
}

function endPan() {
  if (!pan) return;
  const { id } = pan;
  pan = null;
  viewport.classList.remove('is-panning');
  if (viewport.hasPointerCapture(id)) viewport.releasePointerCapture(id);
}

viewport.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.pointerType !== 'mouse' || event.button !== 0
      || !viewport.hasAttribute('data-pannable')
      || event.target.closest('.diagram-navigation, .fullscreen-zoom, .navigator-clickable, a, button, input, select, textarea, [contenteditable]')) return;
  const bounds = viewport.getBoundingClientRect();
  if (event.clientX >= bounds.left + viewport.clientWidth
      || event.clientY >= bounds.top + viewport.clientHeight) return;
  pan = {
    id: event.pointerId,
    x: event.clientX,
    y: event.clientY,
    left: viewport.scrollLeft,
    top: viewport.scrollTop,
  };
  viewport.focus({ preventScroll: true });
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add('is-panning');
  event.preventDefault();
});
viewport.addEventListener('pointermove', event => {
  if (pan?.id !== event.pointerId) return;
  viewport.scrollTo(pan.left + pan.x - event.clientX, pan.top + pan.y - event.clientY);
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(type, event => {
    if (pan?.id === event.pointerId) endPan();
  });
}
window.addEventListener('blur', endPan);

viewport.addEventListener('wheel', event => {
  if (!event.shiftKey || event.ctrlKey || event.metaKey || !naturalWidth) return;
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1;
  const delta = (event.deltaY || event.deltaX) * unit;
  if (!delta) return;
  event.preventDefault();
  const before = canvas.getBoundingClientRect();
  const pointX = (event.clientX - before.left) / zoom;
  const pointY = (event.clientY - before.top) / zoom;
  manualZoom(zoom * Math.exp(-Math.max(-240, Math.min(240, delta)) * .002));
  const after = canvas.getBoundingClientRect();
  viewport.scrollLeft += after.left + pointX * zoom - event.clientX;
  viewport.scrollTop += after.top + pointY * zoom - event.clientY;
}, { passive: false });

const toolbarToggle = document.getElementById('toolbar-toggle');
const toolbarContent = document.getElementById('toolbar-content');
const toolbarSummary = document.getElementById('toolbar-summary');
toolbarToggle.onclick = () => {
  toolbarContent.hidden = !toolbarContent.hidden;
  toolbarSummary.hidden = !toolbarContent.hidden;
  toolbarToggle.setAttribute('aria-expanded', String(!toolbarContent.hidden));
  toolbarToggle.setAttribute('aria-label', toolbarContent.hidden ? '展开图形工具栏' : '收起图形工具栏');
  toolbarToggle.textContent = toolbarContent.hidden ? '⌄' : '⌃';
};

let changingDisplayMode = false;
const modeLabels = { default: '默认视图', browser: '浏览器全屏', screen: '屏幕全屏' };
const nextMode = { default: 'browser', browser: 'screen', screen: 'default' };
function displayMode() {
  if (document.fullscreenElement === viewport) return 'screen';
  return viewport.classList.contains('is-fullscreen') ? 'browser' : 'default';
}

function syncFullscreen() {
  endPan();
  const mode = displayMode();
  const active = mode !== 'default';
  const nextLabel = modeLabels[nextMode[mode]];
  viewport.dataset.displayMode = mode;
  displayButtons.forEach(button => {
    button.textContent = nextLabel;
    button.setAttribute('aria-pressed', String(active));
    button.setAttribute('aria-label', '当前' + modeLabels[mode] + '，切换到' + nextLabel);
  });
  if (active) {
    if (navigation.parentElement !== viewport) viewport.prepend(navigation);
    viewport.focus({ preventScroll: true });
  } else {
    navigationHome.after(navigation);
    fullscreenButton.focus({ preventScroll: true });
  }
  if (fitMode) requestAnimationFrame(() => { if (fitMode) fit(); });
}

async function cycleDisplayMode() {
  if (changingDisplayMode) return;
  changingDisplayMode = true;
  try {
    switch (displayMode()) {
      case 'default':
        viewport.classList.add('is-fullscreen');
        break;
      case 'browser':
        try {
          await viewport.requestFullscreen();
        } finally {
          viewport.classList.remove('is-fullscreen');
        }
        break;
      case 'screen':
        await document.exitFullscreen();
        break;
    }
  } catch (error) {
    // Embedded browsers may restrict screen fullscreen.
    console.info('无法切换屏幕全屏', error);
  } finally {
    changingDisplayMode = false;
    syncFullscreen();
  }
}

viewport.dataset.displayMode = 'default';
displayButtons.forEach(button => { button.onclick = cycleDisplayMode; });
document.addEventListener('fullscreenchange', syncFullscreen);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && displayMode() === 'browser') {
    viewport.classList.remove('is-fullscreen');
    syncFullscreen();
  }
});

document.getElementById('export').onclick = () => {
  const svg = canvas.querySelector('svg').cloneNode(true);
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  svg.setAttribute('width', naturalWidth);
  svg.setAttribute('height', naturalHeight);
  svg.style.maxWidth = 'none';
  svg.style.backgroundColor = '#fff';
  const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'flowchart-' + (selected + 1) + '.svg';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

if (typeof mermaid === 'undefined') {
  status.textContent = 'Mermaid.js 加载失败，请保留 HTML 与图类型目录的相对位置。';
} else {
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme: 'base',
    look: 'classic',
    layout: 'dagre',
    htmlLabels: false,
    fontFamily: 'Arial, "PingFang SC", "Microsoft YaHei", sans-serif',
    themeVariables: {
      primaryColor: '#e7f2ff',
      primaryBorderColor: '#6b8bb7',
      primaryTextColor: '#292735',
      lineColor: '#53657e',
      edgeLabelBackground: '#f6f5fa',
      clusterBkg: '#f6f5fa',
      clusterBorder: '#d9d5e5',
    },
    flowchart: { useMaxWidth: false, htmlLabels: false, curve: 'linear', wrappingWidth: 240 },
  });
  select(0);
}
