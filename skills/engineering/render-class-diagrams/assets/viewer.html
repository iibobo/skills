<script id="diagram-data" type="application/json">[{"title": "1. 执行模块", "source": "classDiagram\n    direction TB\n    class Job {\n        \u003c\u003cinterface>>\n        +call(request)\n    }\n    class AbstractWorker {\n        \u003c\u003cabstract>>\n        +call(request)\n    }\n    class Worker {\n        +call(request)\n        +getStatus()\n    }\n    Job \u003c|.. AbstractWorker : 实现\n    AbstractWorker \u003c|-- Worker : 继承\n    note for Worker \"执行订单任务\"\n    style Job fill:#E7F2FF,stroke:#3D78A8,color:#173A58\n    style AbstractWorker fill:#FFF0DD,stroke:#B67526,color:#694011\n    style Worker fill:#DCD0F3,stroke:#8055BA,color:#292735"}, {"title": "2. 缓存模块", "source": "classDiagram\n    direction TB\n    class Store {\n        \u003c\u003cinterface>>\n        +add(data)\n        +get(id)\n        +clear()\n    }\n    class LocalCache {\n        +add(data)\n        +get(id)\n        +clear()\n    }\n    Store \u003c|.. LocalCache : 实现\n    note for LocalCache \"保存本地缓存\"\n    style Store fill:#E7F2FF,stroke:#3D78A8,color:#173A58\n    style LocalCache fill:#DCD0F3,stroke:#8055BA,color:#292735"}]</script>

<script>
'use strict';
const diagrams=JSON.parse(document.getElementById('diagram-data').textContent);
const tabs=document.getElementById('tabs'), canvas=document.getElementById('canvas'), viewport=document.getElementById('viewport'), status=document.getElementById('status');
const controls=[...document.querySelectorAll('.controls button,.fullscreen-zoom button')];
const cache=new Map();
const navigation=document.getElementById('diagram-navigation'),navigationHome=document.createComment('类图导航原始位置');
navigation.before(navigationHome);
let selected=0, zoom=1, naturalWidth=0, naturalHeight=0, renderSequence=0, fitMode=true;
function setZoom(value){zoom=Math.max(.1,Math.min(3,value));canvas.style.width=(naturalWidth*zoom)+'px';canvas.style.height=(naturalHeight*zoom)+'px';const label=Math.round(zoom*100)+'%';document.getElementById('scale').textContent=label;document.getElementById('fullscreen-scale').textContent=label;}
function fit(){
  fitMode=true;
  if(!naturalWidth||!naturalHeight)return;
  const style=getComputedStyle(viewport);
  const availableWidth=viewport.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
  let availableHeight=viewport.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
  const zoomBar=document.querySelector('.fullscreen-zoom');
  if(getComputedStyle(zoomBar).display!=='none'){
    const bar=zoomBar.getBoundingClientRect(),frame=viewport.getBoundingClientRect();
    availableHeight-=Math.max(0,frame.bottom-bar.top+12-parseFloat(style.paddingBottom));
  }
  setZoom(Math.min(1,availableWidth/naturalWidth,availableHeight/naturalHeight));
  viewport.scrollTo(0,0);
}
const methodKinds={
  build:{label:'创建 / 构建',color:'#7C1CC4',names:new Set(['builder','mutate','prompt'])},
  configure:{label:'配置 / 增强',color:'#946000',names:new Set(['system','user','options','advisors','tools','before','after'])},
  execute:{label:'执行 / 调用',color:'#C21E32',names:new Set(['call','stream','content','chatResponse','entity','adviseCall','adviseStream','nextCall','nextStream','embed','executeToolCalls'])},
  read:{label:'读取 / 查询',color:'#0057D9',names:new Set(['name','description','inputSchema','dimensions','similaritySearch','doSimilaritySearch','resolveToolDefinitions'])},
  write:{label:'写入 / 清理',color:'#08753B',names:new Set(['add','doAdd','accept','saveAll','delete','deleteByConversationId','clear'])}
};
function colorMethods(svg){
  for(const text of svg.querySelectorAll('.methods-group text')){
    const match=text.textContent.trim().match(/^[+\-#~]?\s*(\w+)\s*\(/);if(!match)continue;
    const method=match[1];const entry=Object.entries(methodKinds).find(([kind,info])=>info.names.has(method)||(kind==='read'&&/^(get|has|find)/.test(method)));
    if(!entry)continue;
    const [kind,info]=entry;text.dataset.methodKind=kind;text.dataset.methodName=method;text.setAttribute('aria-label',method+'，'+info.label);
    for(const element of [text,...text.querySelectorAll('tspan')]){element.style.setProperty('fill',info.color,'important');element.style.setProperty('font-weight','600','important');}
  }
}
function showResult(result,index){canvas.innerHTML=result.svg;const svg=canvas.querySelector('svg');colorMethods(svg);alignClassLevels(svg);linkDiagramSources(svg);svg.setAttribute('role','group');svg.setAttribute('aria-label',diagrams[index].title);const viewBox=svg.viewBox.baseVal;naturalWidth=viewBox.width;naturalHeight=viewBox.height;status.hidden=true;fit();viewport.scrollTo(0,0);controls.forEach(b=>b.disabled=false);}
async function select(index){
  selected=index;const sequence=++renderSequence;document.getElementById('title').textContent=diagrams[index].title;
  tabs.querySelectorAll('button').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===index));b.tabIndex=i===index?0:-1;});
  requestAnimationFrame(()=>{const button=tabs.children[selected],area=tabs.getBoundingClientRect(),item=button.getBoundingClientRect();if(item.left<area.left)tabs.scrollLeft+=item.left-area.left;else if(item.right>area.right)tabs.scrollLeft+=item.right-area.right;});document.getElementById('diagram-panel').setAttribute('aria-labelledby','tab-'+index);
  controls.forEach(b=>b.disabled=true);canvas.innerHTML='';canvas.style.width='';canvas.style.height='';status.hidden=false;status.textContent='正在绘制类图…';
  try{if(!cache.has(index)){cache.set(index,await mermaid.render('class-diagram-'+index,diagrams[index].source));}if(sequence===renderSequence)showResult(cache.get(index),index);}
  catch(error){if(sequence===renderSequence){status.textContent='类图渲染失败：'+error.message;document.body.dataset.renderError='true';}console.error(error);}
}
diagrams.forEach((d,i)=>{const b=document.createElement('button');b.id='tab-'+i;b.type='button';b.role='tab';b.setAttribute('aria-controls','diagram-panel');b.textContent=d.title.split('：')[0];b.addEventListener('click',()=>select(i));b.addEventListener('keydown',e=>{let next;if(e.key==='ArrowRight')next=(i+1)%diagrams.length;if(e.key==='ArrowLeft')next=(i+diagrams.length-1)%diagrams.length;if(e.key==='Home')next=0;if(e.key==='End')next=diagrams.length-1;if(next!==undefined){e.preventDefault();tabs.children[next].focus({preventScroll:true});select(next);}});tabs.append(b);});
function changeDiagram(direction){select((selected+direction+diagrams.length)%diagrams.length);}

   if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||tabs.contains(event.target)||event.target.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])'))return;

 });
document.getElementById('zoom-in').onclick=()=>{fitMode=false;setZoom(zoom*1.2);};document.getElementById('zoom-out').onclick=()=>{fitMode=false;setZoom(zoom/1.2);};document.getElementById('actual').onclick=()=>{fitMode=false;setZoom(1);};document.getElementById('fit').onclick=fit;

document.querySelectorAll('.row-toggle').forEach(button=>{
  button.addEventListener('click',()=>{
    const row=button.closest('.collapsible-row'),content=document.getElementById(button.getAttribute('aria-controls'));
    const collapsed=row.classList.toggle('is-collapsed');
    content.hidden=collapsed;const summary=row.querySelector('.row-summary');if(summary)summary.hidden=row.closest('#legend-dock')?false:!collapsed;
    if(row.closest('#legend-dock')&&!collapsed){document.querySelectorAll('#legend-dock .row-toggle').forEach(other=>{if(other!==button&&other.getAttribute('aria-expanded')==='true')other.click();});}
    button.setAttribute('aria-expanded',String(!collapsed));
    const label=(collapsed?'展开':'收起')+button.dataset.label;button.setAttribute('aria-label',label);button.title=label;
    requestAnimationFrame(()=>{if(fitMode)fit();});
  });

  row.style.cursor='pointer';

function closeLegendPopups(){document.querySelectorAll('#legend-dock .row-toggle[aria-expanded="true"]').forEach(button=>button.click());}

const fullscreenButton=document.getElementById('fullscreen');
viewport.addEventListener('wheel',event=>{
  if(!event.shiftKey||event.ctrlKey||event.metaKey||!naturalWidth)return;
  const delta=(event.deltaY||event.deltaX)*(event.deltaMode===1?16:event.deltaMode===2?viewport.clientHeight:1);
  if(!delta)return;
  event.preventDefault();
  const before=canvas.getBoundingClientRect();
  const pointX=(event.clientX-before.left)/zoom,pointY=(event.clientY-before.top)/zoom;
  fitMode=false;
  setZoom(zoom*Math.exp(-Math.max(-240,Math.min(240,delta))*.002));
  const after=canvas.getBoundingClientRect();
  viewport.scrollLeft+=after.left+pointX*zoom-event.clientX;
  viewport.scrollTop+=after.top+pointY*zoom-event.clientY;
},{passive:false});
document.querySelector('.fullscreen-zoom').title='按住 Shift + 鼠标滚轮缩放：向上放大，向下缩小';
viewport.setAttribute('aria-description','按住 Shift 并滚动鼠标滚轮缩放类图，普通模式与全屏模式均支持');
let changingDisplayMode=false;
viewport.dataset.displayMode='default';
function displayMode(){return document.fullscreenElement===viewport?'screen':viewport.classList.contains('is-fullscreen')?'browser':'default';}
function syncFullscreen(){
  const mode=displayMode(),active=mode!=='default';
  const labels={default:'默认视图',browser:'浏览器全屏',screen:'屏幕全屏'};
  const next={default:'browser',browser:'screen',screen:'default'}[mode];
  viewport.dataset.displayMode=mode;
  document.querySelectorAll('[data-display-cycle]').forEach(button=>{
    button.textContent=labels[next];button.setAttribute('aria-pressed',String(active));
    button.setAttribute('aria-label','当前'+labels[mode]+'，切换到'+labels[next]);
    button.title='当前：'+labels[mode]+'；点击切换到'+labels[next]+'；Esc 返回默认视图';
  });
  document.body.classList.toggle('diagram-expanded',active);
  if(active){if(navigation.parentElement!==viewport)viewport.prepend(navigation);}else navigationHome.after(navigation);
  if(active)viewport.focus({preventScroll:true});else fullscreenButton.focus({preventScroll:true});
  requestAnimationFrame(fit);
}
async function cycleDisplayMode(){
  if(changingDisplayMode)return;
  changingDisplayMode=true;
  try{
    const mode=displayMode();
    if(mode==='default')viewport.classList.add('is-fullscreen');
    else if(mode==='browser'){
      if(!viewport.requestFullscreen||!document.fullscreenEnabled)throw new Error('Screen fullscreen unavailable');
      await viewport.requestFullscreen();viewport.classList.remove('is-fullscreen');
    }else await document.exitFullscreen();
  }catch{
    // 屏幕全屏受限时跳过该模式，返回默认视图。
    if(document.fullscreenElement!==viewport)viewport.classList.remove('is-fullscreen');
  }finally{changingDisplayMode=false;syncFullscreen();}
}
document.querySelectorAll('[data-display-cycle]').forEach(button=>button.addEventListener('click',cycleDisplayMode));
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  if(document.fullscreenElement===viewport)document.exitFullscreen().catch(()=>{});
  else if(viewport.classList.contains('is-fullscreen')){viewport.classList.remove('is-fullscreen');syncFullscreen();}
});
document.getElementById('export').onclick=()=>{
  const svg=canvas.querySelector('svg').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('width',naturalWidth);svg.setAttribute('height',naturalHeight);svg.style.maxWidth='none';svg.style.backgroundColor='#ffffff';
  const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n',new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='class-diagram-'+(selected+1)+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
